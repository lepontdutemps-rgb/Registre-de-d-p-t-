<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registre d'atelier — Horlogerie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --ink:#1a1c1f;
    --ink-soft:#6b7176;
    --bg:#f5f6f7;
    --panel:#ffffff;
    --border:#e6e8ea;
    --accent:#a9762f;
    --accent-dark:#8a5f24;
    --steel:#3d5a80;
    --verdigris:#3f7a63;
    --muted:#9aa0a6;
    --rouge:#c0392b;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;
    line-height:1.45;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 90px;}

  /* Header */
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px;}
  h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;}
  .biz-line{font-size:13px;color:var(--ink-soft);margin-top:3px;}
  .biz-line button{border:none;background:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0;margin-left:8px;font-family:inherit;font-weight:600;}
  .date-badge{font-size:12px;color:var(--muted);white-space:nowrap;margin-top:3px;}

  /* Stats */
  .stats{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;overflow:hidden;}
  .stat{flex:1;padding:14px 10px;text-align:center;border-right:1px solid var(--border);}
  .stat:last-child{border-right:none;}
  .stat .n{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;line-height:1;}
  .stat .l{font-size:10.5px;color:var(--ink-soft);margin-top:5px;}
  .stat.overdue .n{color:var(--rouge);}

  /* Toolbar */
  .toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  input[type=text],input[type=search],input[type=email],select,textarea,input[type=date]{
    font-family:inherit;font-size:15px;border:1px solid var(--border);border-radius:9px;
    padding:11px 12px;background:var(--panel);color:var(--ink);width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(169,118,47,.14);}
  .search-box{flex:1;min-width:140px;}
  select#filterStatus{width:auto;}
  .btn{font-family:inherit;font-weight:600;font-size:14px;border:none;border-radius:9px;padding:11px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-full{width:100%;}
  .btn-danger{color:var(--rouge);}

  /* List */
  .empty{background:var(--panel);border:1px dashed var(--border);border-radius:var(--radius);padding:44px 20px;text-align:center;color:var(--ink-soft);font-size:14px;}
  .listwrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .ticket{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;}
  .ticket:last-child{border-bottom:none;}
  .ticket:hover{background:#fafafa;}
  .num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);flex-shrink:0;width:44px;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.depose{background:var(--steel);}
  .dot.en_cours{background:var(--accent);}
  .dot.pret{background:var(--verdigris);}
  .dot.recupere{background:var(--muted);}
  .ticket-main{flex:1;min-width:0;}
  .ticket-main .obj{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ticket-main .client{font-size:12.5px;color:var(--ink-soft);margin-top:2px;display:flex;align-items:center;gap:6px;}
  .cam-badge{font-size:11px;color:var(--muted);}
  .ticket-right{text-align:right;font-size:12px;color:var(--ink-soft);flex-shrink:0;}
  .ticket-right .late{color:var(--rouge);font-weight:600;}
  .chev{color:var(--muted);flex-shrink:0;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(20,22,24,.48);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  @media (min-width:640px){ .overlay{align-items:center;padding:24px;} }
  .modal{background:var(--panel);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:22px 20px 24px;position:relative;}
  @media (min-width:640px){ .modal{border-radius:16px;} }
  .modal h2{margin:0 0 2px;font-size:18px;}
  .modal .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
  .form-grid{display:grid;grid-template-columns:1fr;gap:12px;}
  @media (min-width:520px){ .form-grid{grid-template-columns:1fr 1fr;} .form-grid .full{grid-column:1/-1;} }
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  textarea{resize:vertical;min-height:48px;font-family:inherit;}
  .modal-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:18px;border-top:1px solid var(--border);padding-top:16px;}
  .close-x{position:absolute;top:12px;right:14px;background:var(--bg);border:none;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--ink-soft);}

  /* Detail */
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;font-size:13.5px;margin:16px 0;}
  .detail-grid .k{color:var(--ink-soft);font-size:11px;margin-bottom:2px;}
  .status-row{display:flex;gap:6px;flex-wrap:wrap;}
  .status-btn{font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:99px;border:1px solid var(--border);background:var(--panel);cursor:pointer;color:var(--ink-soft);}
  .status-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* Photos */
  .photo-section{margin-top:16px;}
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin-top:8px;}
  .photo-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:#f0f0f0;}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer;}
  .photo-thumb .rm{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;line-height:1;}
  .photo-add{aspect-ratio:1;border:1.5px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--ink-soft);cursor:pointer;font-size:11px;gap:4px;background:var(--bg);}
  .photo-add:hover{border-color:var(--accent);color:var(--accent);}
  .photo-add input{display:none;}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:80;padding:20px;}
  #lightbox img{max-width:100%;max-height:100%;border-radius:6px;}
  #lightbox button{position:absolute;top:18px;right:18px;background:none;border:none;color:#fff;font-size:26px;cursor:pointer;}

  /* Receipt (mini-printer share image) */
  #receiptTemplate{
    position:fixed;top:-99999px;left:0;
    width:380px;background:#fff;color:#000;
    font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.5;
    padding:20px 18px;
  }
  #receiptTemplate .r-center{text-align:center;}
  #receiptTemplate .r-name{font-weight:700;font-size:16px;}
  #receiptTemplate .r-sub{font-size:11px;}
  #receiptTemplate .r-dash{border-top:1px dashed #000;margin:10px 0;}
  #receiptTemplate .r-num{font-weight:700;font-size:15px;text-align:center;margin:6px 0;}
  #receiptTemplate .r-line{margin:5px 0;}
  #receiptTemplate .r-lbl{font-size:10px;text-transform:uppercase;color:#333;display:block;}
  #receiptTemplate .r-legal{font-size:9px;color:#333;margin-top:8px;}
  #receiptTemplate .r-sign{margin-top:16px;font-size:11px;}
  #receiptTemplate .r-sign div{border-top:1px solid #000;margin-top:22px;padding-top:3px;}
  #receiptTemplate .r-thanks{text-align:center;margin-top:14px;font-size:11px;}

  #sharePreview{max-width:220px;border:1px solid var(--border);border-radius:8px;margin:10px auto 0;display:block;}

  footer.hint{margin-top:26px;font-size:12px;color:var(--muted);text-align:center;}

  @media (max-width:520px){
    .toolbar{flex-direction:column;}
    select#filterStatus{width:100%;}
  }

  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea,#printArea *{visibility:visible;}
    #printArea{display:block;position:absolute;top:0;left:0;width:100%;}
    @page{size:A4;margin:14mm;}
    .p-half{padding:6px 0 10px;}
    .p-title{font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:16px;margin:0;}
    .p-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;text-transform:uppercase;}
    .p-row{display:flex;justify-content:space-between;border-bottom:1px solid #333;padding:4px 0;margin-bottom:8px;font-size:11px;}
    .p-row .lbl{font-size:8px;text-transform:uppercase;color:#555;display:block;}
    .p-block{border-bottom:1px solid #333;padding:4px 0 8px;margin-bottom:8px;font-size:11px;}
    .p-block .lbl{font-size:8px;text-transform:uppercase;color:#555;display:block;margin-bottom:2px;}
    .p-cols3{display:flex;gap:10px;}
    .p-cols3 > div{flex:1;}
    .p-legal{font-size:7.5px;color:#555;font-style:italic;margin:6px 0;}
    .p-sign{display:flex;justify-content:space-between;font-size:10px;margin-top:20px;}
    .p-sign div{width:45%;border-top:1px solid #999;padding-top:4px;}
    .p-cut{border-top:1px dashed #999;text-align:center;font-size:9px;color:#777;margin:16px 0;padding-top:4px;}
  }
</style>
</head>
<body>
<div class="wrap" id="app">

  <header>
    <div>
      <h1>Bulletins de dépôt</h1>
      <p class="biz-line" id="bizLine">Chargement…</p>
    </div>
    <div class="date-badge" id="todayBadge"></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input class="search-box" type="search" id="search" placeholder="Rechercher un client, un objet…">
    <select id="filterStatus">
      <option value="">Tous les statuts</option>
      <option value="depose">Déposé</option>
      <option value="en_cours">En réparation</option>
      <option value="pret">Prêt</option>
      <option value="recupere">Récupéré</option>
    </select>
  </div>
  <button class="btn btn-primary btn-full" id="btnNew" style="margin-bottom:10px;">+ Nouveau dépôt</button>
  <div style="display:flex;gap:8px;margin-bottom:16px;">
    <button class="btn btn-ghost" id="btnExport" style="flex:1;">⬇ Exporter une sauvegarde</button>
    <label class="btn btn-ghost" style="flex:1;cursor:pointer;">
      ⬆ Importer une sauvegarde
      <input type="file" accept="application/json" id="importInput" style="display:none;">
    </label>
  </div>

  <div id="list"></div>

  <footer class="hint">Données enregistrées sur cet appareil, dans ce navigateur. Exportez une sauvegarde régulièrement pour ne rien perdre.</footer>
</div>

<!-- New / edit ticket modal -->
<div class="overlay" id="formOverlay" style="display:none;">
  <div class="modal">
    <button class="close-x" data-close>&times;</button>
    <h2 id="formTitle">Nouveau dépôt</h2>
    <p class="sub">* recommandé pour un suivi complet</p>
    <div class="form-grid" id="formGrid">
      <div class="field"><label>Date de dépôt</label><input type="date" id="f_date_depot"></div>
      <div class="field"><label>Date de retrait prévue</label><input type="date" id="f_date_retrait"></div>
      <div class="field"><label>Nom du client *</label><input type="text" id="f_client_nom" placeholder="Jean Martin"></div>
      <div class="field"><label>Téléphone client</label><input type="text" id="f_client_tel" placeholder="06 12 34 56 78"></div>
      <div class="field full"><label>Email client</label><input type="text" id="f_client_email" placeholder="jean.martin@email.fr"></div>
      <div class="field full"><label>Objet — type / marque / modèle *</label><input type="text" id="f_objet_marque" placeholder="Omega Seamaster automatique"></div>
      <div class="field full"><label>N° de série / accessoires remis</label><input type="text" id="f_objet_description" placeholder="Bracelet cuir, écrin, n° série 123456"></div>
      <div class="field full"><label>Panne constatée par le client</label><textarea id="f_panne"></textarea></div>
      <div class="field full"><label>Travaux à effectuer / devis</label><textarea id="f_travaux"></textarea></div>
      <div class="field"><label>Prix estimé (€)</label><input type="text" id="f_prix" placeholder="120"></div>
      <div class="field"><label>Acompte versé (€)</label><input type="text" id="f_acompte" placeholder="30"></div>
      <div class="field full photo-section">
        <label>Photos — preuve de dépôt</label>
        <div class="photo-grid" id="formPhotoGrid"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close>Annuler</button>
      <button class="btn btn-primary" id="btnSaveTicket">Enregistrer le dépôt</button>
    </div>
  </div>
</div>

<!-- Detail / print modal -->
<div class="overlay" id="detailOverlay" style="display:none;">
  <div class="modal">
    <button class="close-x" data-close>&times;</button>
    <h2 id="detailTitle">Bulletin</h2>
    <p class="sub" id="detailSub"></p>
    <div class="status-row" id="statusRow"></div>
    <div class="detail-grid" id="detailGrid"></div>
    <div class="photo-section">
      <label>Photos</label>
      <div class="photo-grid" id="detailPhotoGrid"></div>
    </div>
    <div class="modal-actions" style="flex-direction:column;align-items:stretch;">
      <img id="sharePreview" style="display:none;">
      <div style="display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;">
        <button class="btn btn-ghost btn-danger" id="btnDelete">Supprimer</button>
        <button class="btn btn-ghost" id="btnEdit">Modifier</button>
        <button class="btn btn-ghost" id="btnPrint">🖨 Imprimer A4</button>
        <button class="btn btn-primary" id="btnShareImg">📤 Reçu à imprimer / envoyer</button>
      </div>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="overlay" id="settingsOverlay" style="display:none;">
  <div class="modal">
    <button class="close-x" data-close>&times;</button>
    <h2>Paramètres de l'atelier</h2>
    <p class="sub">Ces informations apparaissent sur les bulletins imprimés.</p>
    <div class="form-grid">
      <div class="field full"><label>Nom de l'entreprise</label><input type="text" id="s_nom" placeholder="Atelier Horlogerie Dupont"></div>
      <div class="field full"><label>Adresse</label><input type="text" id="s_adresse" placeholder="12 rue de l'Horloge, 75000 Paris"></div>
      <div class="field"><label>Téléphone</label><input type="text" id="s_tel"></div>
      <div class="field"><label>SIRET</label><input type="text" id="s_siret"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close>Annuler</button>
      <button class="btn btn-primary" id="btnSaveSettings">Enregistrer</button>
    </div>
  </div>
</div>

<div id="lightbox"><button id="lightboxClose">&times;</button><img id="lightboxImg" src=""></div>

<div id="receiptTemplate"></div>

<div id="printArea"></div>

<script>
const STORAGE_KEY = 'registre-data';
let state = { counter: 0, tickets: [], settings: { nom:'', adresse:'', tel:'', siret:'' } };
let editingId = null;
let formPhotos = [];

const STATUS_LABELS = { depose:'Déposé', en_cours:'En réparation', pret:'Prêt', recupere:'Récupéré' };
const STATUS_ORDER = ['depose','en_cours','pret','recupere'];

function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      state = Object.assign({counter:0,tickets:[],settings:{nom:'',adresse:'',tel:'',siret:''}}, JSON.parse(raw));
    }
  }catch(e){}
  render();
}
async function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error(e); alert("La sauvegarde locale a échoué (mémoire du navigateur pleine ou bloquée). Pensez à exporter une sauvegarde régulièrement."); }
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayISO();
  a.href = url;
  a.download = `registre-horloger-sauvegarde-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || !Array.isArray(parsed.tickets)) throw new Error('Format invalide');
      if(!confirm(`Importer cette sauvegarde remplacera les ${state.tickets.length} bulletin(s) actuels par les ${parsed.tickets.length} de ce fichier. Continuer ?`)) return;
      state = Object.assign({counter:0,tickets:[],settings:{nom:'',adresse:'',tel:'',siret:''}}, parsed);
      await saveState();
      render();
      alert('Sauvegarde importée avec succès.');
    }catch(err){
      alert("Ce fichier n'est pas une sauvegarde valide.");
    }
  };
  reader.readAsText(file);
}

function render(){
  document.getElementById('todayBadge').textContent = fmtDate(todayISO());
  const biz = state.settings;
  document.getElementById('bizLine').innerHTML = (biz.nom||'Aucune entreprise renseignée') + ' <button id="editBiz">modifier</button>';
  document.getElementById('editBiz').onclick = openSettings;
  renderStats();
  renderList();
}

function renderStats(){
  const total = state.tickets.length;
  const enCours = state.tickets.filter(t=>t.statut==='depose'||t.statut==='en_cours').length;
  const prets = state.tickets.filter(t=>t.statut==='pret').length;
  const retard = state.tickets.filter(t=>t.statut!=='recupere' && t.date_retrait && t.date_retrait<todayISO()).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${total}</div><div class="l">Total</div></div>
    <div class="stat"><div class="n">${enCours}</div><div class="l">En atelier</div></div>
    <div class="stat"><div class="n">${prets}</div><div class="l">Prêts</div></div>
    <div class="stat overdue"><div class="n">${retard}</div><div class="l">En retard</div></div>`;
}

function renderList(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const statusFilter = document.getElementById('filterStatus').value;
  let tickets = [...state.tickets].sort((a,b)=>b.numero-a.numero);
  if(statusFilter) tickets = tickets.filter(t=>t.statut===statusFilter);
  if(q) tickets = tickets.filter(t=>(t.client_nom||'').toLowerCase().includes(q)||(t.objet_marque||'').toLowerCase().includes(q)||String(t.numero).includes(q));

  const list = document.getElementById('list');
  if(tickets.length===0){
    list.innerHTML = `<div class="empty">Aucun bulletin${q||statusFilter?' trouvé':'. Ajoutez votre premier dépôt ci-dessus.'}</div>`;
    return;
  }
  list.innerHTML = '<div class="listwrap">' + tickets.map(t=>{
    const late = t.statut!=='recupere' && t.date_retrait && t.date_retrait<todayISO();
    const photoCount = (t.photos||[]).length;
    return `
    <div class="ticket" data-id="${t.id}">
      <span class="num">N°${String(t.numero).padStart(4,'0')}</span>
      <span class="dot ${t.statut}" title="${STATUS_LABELS[t.statut]}"></span>
      <div class="ticket-main">
        <div class="obj">${escapeHtml(t.objet_marque||'Objet non précisé')}</div>
        <div class="client">${escapeHtml(t.client_nom||'Client non précisé')}${photoCount?` <span class="cam-badge">📷 ${photoCount}</span>`:''}</div>
      </div>
      <div class="ticket-right">
        <div class="${late?'late':''}">${late?'Retard · ':''}${fmtDate(t.date_retrait)}</div>
      </div>
      <span class="chev">›</span>
    </div>`;
  }).join('') + '</div>';

  list.querySelectorAll('.ticket').forEach(row=>{
    row.addEventListener('click', ()=>openDetail(row.getAttribute('data-id')));
  });
}

/* ---- Photo helpers ---- */
function compressImage(file, maxDim=1000, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>maxDim||h>maxDim){ if(w>h){h=Math.round(h*maxDim/w);w=maxDim;} else {w=Math.round(w*maxDim/h);h=maxDim;} }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderFormPhotos(){
  const grid = document.getElementById('formPhotoGrid');
  grid.innerHTML = formPhotos.map((p,i)=>`
    <div class="photo-thumb"><img src="${p.dataUrl}" data-lightbox="${i}"><button class="rm" data-rm="${i}">&times;</button></div>
  `).join('') + `
    <label class="photo-add">
      <input type="file" accept="image/*" capture="environment" multiple id="photoInput">
      <span>📷</span><span>Ajouter</span>
    </label>`;
  grid.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{
    formPhotos.splice(parseInt(b.getAttribute('data-rm')),1); renderFormPhotos();
  }));
  grid.querySelectorAll('[data-lightbox]').forEach(img=>img.addEventListener('click',()=>openLightbox(img.src)));
  const input = document.getElementById('photoInput');
  input.addEventListener('change', async ()=>{
    for(const file of input.files){
      try{ const dataUrl = await compressImage(file); formPhotos.push({id:'p_'+Date.now()+Math.random().toString(36).slice(2,6), dataUrl}); }
      catch(e){ console.error(e); }
    }
    renderFormPhotos();
  });
}

function openLightbox(src){
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').style.display='flex';
}
document.getElementById('lightboxClose').addEventListener('click',()=>document.getElementById('lightbox').style.display='none');
document.getElementById('lightbox').addEventListener('click',e=>{ if(e.target.id==='lightbox') e.target.style.display='none'; });

/* ---- New / edit form ---- */
function openNewForm(){
  editingId = null;
  formPhotos = [];
  document.getElementById('formTitle').textContent = 'Nouveau dépôt';
  ['f_client_nom','f_client_tel','f_client_email','f_objet_marque','f_objet_description','f_panne','f_travaux','f_prix','f_acompte'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f_date_depot').value = todayISO();
  document.getElementById('f_date_retrait').value = '';
  renderFormPhotos();
  document.getElementById('formOverlay').style.display='flex';
}
function openEditForm(id){
  const t = state.tickets.find(x=>x.id===id);
  if(!t) return;
  editingId = id;
  formPhotos = (t.photos||[]).slice();
  document.getElementById('formTitle').textContent = 'Modifier N°' + String(t.numero).padStart(4,'0');
  document.getElementById('f_date_depot').value = t.date_depot||'';
  document.getElementById('f_date_retrait').value = t.date_retrait||'';
  document.getElementById('f_client_nom').value = t.client_nom||'';
  document.getElementById('f_client_tel').value = t.client_tel||'';
  document.getElementById('f_client_email').value = t.client_email||'';
  document.getElementById('f_objet_marque').value = t.objet_marque||'';
  document.getElementById('f_objet_description').value = t.objet_description||'';
  document.getElementById('f_panne').value = t.panne||'';
  document.getElementById('f_travaux').value = t.travaux||'';
  document.getElementById('f_prix').value = t.prix||'';
  document.getElementById('f_acompte').value = t.acompte||'';
  renderFormPhotos();
  document.getElementById('detailOverlay').style.display='none';
  document.getElementById('formOverlay').style.display='flex';
}

async function saveTicketFromForm(){
  const data = {
    date_depot: document.getElementById('f_date_depot').value || todayISO(),
    date_retrait: document.getElementById('f_date_retrait').value,
    client_nom: document.getElementById('f_client_nom').value.trim(),
    client_tel: document.getElementById('f_client_tel').value.trim(),
    client_email: document.getElementById('f_client_email').value.trim(),
    objet_marque: document.getElementById('f_objet_marque').value.trim(),
    objet_description: document.getElementById('f_objet_description').value.trim(),
    panne: document.getElementById('f_panne').value.trim(),
    travaux: document.getElementById('f_travaux').value.trim(),
    prix: document.getElementById('f_prix').value.trim(),
    acompte: document.getElementById('f_acompte').value.trim(),
    photos: formPhotos.slice(),
  };
  if(!data.client_nom && !data.objet_marque){ alert("Merci de renseigner au moins le nom du client ou l'objet déposé."); return; }
  if(editingId){
    const t = state.tickets.find(x=>x.id===editingId);
    Object.assign(t, data);
  } else {
    state.counter += 1;
    state.tickets.push({ id:'tk_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), numero: state.counter, statut:'depose', created_at:new Date().toISOString(), ...data });
  }
  await saveState();
  document.getElementById('formOverlay').style.display='none';
  render();
}

/* ---- Detail ---- */
function openDetail(id){
  const t = state.tickets.find(x=>x.id===id);
  if(!t) return;
  document.getElementById('detailTitle').textContent = 'N°' + String(t.numero).padStart(4,'0');
  document.getElementById('detailSub').textContent = (t.client_nom||'Client non précisé') + ' — déposé le ' + fmtDate(t.date_depot);

  document.getElementById('statusRow').innerHTML = STATUS_ORDER.map(s=>
    `<button class="status-btn ${s===t.statut?'active':''}" data-set-status="${s}">${STATUS_LABELS[s]}</button>`).join('');
  document.getElementById('statusRow').querySelectorAll('[data-set-status]').forEach(b=>{
    b.addEventListener('click', async ()=>{ t.statut = b.getAttribute('data-set-status'); await saveState(); openDetail(id); renderList(); renderStats(); });
  });

  const rows = [
    ['Objet', t.objet_marque], ['Description / accessoires', t.objet_description],
    ['Téléphone', t.client_tel], ['Email', t.client_email],
    ['Retrait prévu', fmtDate(t.date_retrait)], ['Panne constatée', t.panne],
    ['Travaux à effectuer', t.travaux], ['Prix estimé', t.prix?t.prix+' €':'—'],
    ['Acompte versé', t.acompte?t.acompte+' €':'—'],
  ];
  document.getElementById('detailGrid').innerHTML = rows.map(([k,v])=>`<div><div class="k">${k}</div><div>${v?escapeHtml(v):'—'}</div></div>`).join('');

  const pg = document.getElementById('detailPhotoGrid');
  const photos = t.photos||[];
  pg.innerHTML = photos.length
    ? photos.map((p,i)=>`<div class="photo-thumb"><img src="${p.dataUrl}" data-lb="${i}"></div>`).join('')
    : '<span style="font-size:12.5px;color:var(--muted);">Aucune photo</span>';
  pg.querySelectorAll('[data-lb]').forEach(img=>img.addEventListener('click',()=>openLightbox(img.src)));

  document.getElementById('btnEdit').onclick = ()=>openEditForm(id);
  document.getElementById('btnDelete').onclick = async ()=>{
    if(confirm('Supprimer définitivement ce bulletin ?')){
      state.tickets = state.tickets.filter(x=>x.id!==id);
      await saveState();
      document.getElementById('detailOverlay').style.display='none';
      render();
    }
  };
  document.getElementById('btnPrint').onclick = ()=>printTicket(t);
  document.getElementById('btnShareImg').onclick = ()=>shareReceiptImage(t);
  document.getElementById('sharePreview').style.display = 'none';

  document.getElementById('detailOverlay').style.display='flex';
}

/* ---- Print ---- */
function printTicket(t){
  const s = state.settings;
  const half = (tag) => `
    <div class="p-half">
      <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:4px;margin-bottom:8px;">
        <p class="p-title">BULLETIN DE DÉPÔT</p><span class="p-tag">${tag}</span>
      </div>
      <div class="p-row"><div><span class="lbl">N° de bulletin</span>N°${String(t.numero).padStart(4,'0')}</div><div><span class="lbl">Date de dépôt</span>${fmtDate(t.date_depot)}</div></div>
      <div class="p-block"><span class="lbl">Horloger / Entreprise</span>${escapeHtml(s.nom||'—')} — ${escapeHtml(s.adresse||'')}<br>Tél : ${escapeHtml(s.tel||'—')} · SIRET : ${escapeHtml(s.siret||'—')}</div>
      <div class="p-row"><div><span class="lbl">Client</span>${escapeHtml(t.client_nom||'—')}</div><div><span class="lbl">Téléphone</span>${escapeHtml(t.client_tel||'—')}</div></div>
      <div class="p-block"><span class="lbl">Objet déposé</span>${escapeHtml(t.objet_marque||'—')}</div>
      <div class="p-block"><span class="lbl">N° de série / accessoires</span>${escapeHtml(t.objet_description||'—')}</div>
      <div class="p-block"><span class="lbl">Panne constatée</span>${escapeHtml(t.panne||'—')}</div>
      <div class="p-block"><span class="lbl">Travaux à effectuer / devis</span>${escapeHtml(t.travaux||'—')}</div>
      <div class="p-cols3">
        <div><span class="lbl">Prix estimé</span>${t.prix?t.prix+' €':'—'}</div>
        <div><span class="lbl">Acompte versé</span>${t.acompte?t.acompte+' €':'—'}</div>
        <div><span class="lbl">Retrait prévu</span>${fmtDate(t.date_retrait)}</div>
      </div>
      <p class="p-legal">Passé un délai de 6 mois après la date de retrait indiquée ci-dessus, l'entreprise ne pourra être tenue responsable des objets non réclamés, conformément à l'article 2276 du Code civil.</p>
      <div class="p-sign"><div>Signature du client</div><div>Signature de l'horloger</div></div>
    </div>`;
  document.getElementById('printArea').innerHTML = half('SOUCHE — à conserver') + '<div class="p-cut">✂ découper ici</div>' + half('VOLANT — remis au client');
  window.print();
}

async function shareReceiptImage(t){
  const s = state.settings;
  const numero = 'N°' + String(t.numero).padStart(4,'0');
  const tpl = document.getElementById('receiptTemplate');
  tpl.innerHTML = `
    <div class="r-center">
      <div class="r-name">${escapeHtml(s.nom||'Atelier horlogerie')}</div>
      ${s.adresse?`<div class="r-sub">${escapeHtml(s.adresse)}</div>`:''}
      ${s.tel?`<div class="r-sub">Tél : ${escapeHtml(s.tel)}</div>`:''}
    </div>
    <div class="r-dash"></div>
    <div class="r-num">BULLETIN ${numero}</div>
    <div class="r-line"><span class="r-lbl">Date de dépôt</span>${fmtDate(t.date_depot)}</div>
    <div class="r-dash"></div>
    <div class="r-line"><span class="r-lbl">Client</span>${escapeHtml(t.client_nom||'—')}</div>
    ${t.client_tel?`<div class="r-line"><span class="r-lbl">Téléphone</span>${escapeHtml(t.client_tel)}</div>`:''}
    <div class="r-dash"></div>
    <div class="r-line"><span class="r-lbl">Objet déposé</span>${escapeHtml(t.objet_marque||'—')}</div>
    ${t.objet_description?`<div class="r-line"><span class="r-lbl">N° série / accessoires</span>${escapeHtml(t.objet_description)}</div>`:''}
    ${t.panne?`<div class="r-line"><span class="r-lbl">Panne constatée</span>${escapeHtml(t.panne)}</div>`:''}
    ${t.travaux?`<div class="r-line"><span class="r-lbl">Travaux à effectuer</span>${escapeHtml(t.travaux)}</div>`:''}
    <div class="r-dash"></div>
    <div class="r-line"><span class="r-lbl">Prix estimé</span>${t.prix?t.prix+' €':'—'}</div>
    <div class="r-line"><span class="r-lbl">Acompte versé</span>${t.acompte?t.acompte+' €':'—'}</div>
    <div class="r-line"><span class="r-lbl">Retrait prévu</span>${fmtDate(t.date_retrait)}</div>
    <div class="r-legal">Passé un délai de 6 mois après la date de retrait indiquée ci-dessus, l'entreprise ne pourra être tenue responsable des objets non réclamés (art. 2276 du Code civil).</div>
    <div class="r-sign"><div>Signature du client</div><div>Signature de l'horloger</div></div>
    <div class="r-thanks">Merci de votre confiance</div>
  `;

  const btn = document.getElementById('btnShareImg');
  const originalLabel = btn.textContent;
  btn.textContent = 'Génération…';
  btn.disabled = true;

  try{
    await new Promise(r=>requestAnimationFrame(r));
    const canvas = await html2canvas(tpl, {backgroundColor:'#ffffff', scale:3});
    canvas.toBlob(async (blob)=>{
      btn.textContent = originalLabel;
      btn.disabled = false;
      if(!blob) return;
      const filename = `bulletin-${numero.replace('°','')}.png`;
      const file = new File([blob], filename, {type:'image/png'});
      const preview = document.getElementById('sharePreview');
      preview.src = URL.createObjectURL(blob);
      preview.style.display = 'block';

      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{
          await navigator.share({ files:[file], title:`Bulletin ${numero}`, text:`Bulletin de dépôt ${numero} — ${s.nom||''}` });
        }catch(err){
          if(err.name !== 'AbortError') downloadBlob(blob, filename);
        }
      } else {
        downloadBlob(blob, filename);
      }
    }, 'image/png');
  }catch(err){
    console.error(err);
    btn.textContent = originalLabel;
    btn.disabled = false;
    alert("La génération de l'image a échoué. Réessayez, ou utilisez « Imprimer A4 ».");
  }
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ---- Settings ---- */
function openSettings(){
  document.getElementById('s_nom').value = state.settings.nom||'';
  document.getElementById('s_adresse').value = state.settings.adresse||'';
  document.getElementById('s_tel').value = state.settings.tel||'';
  document.getElementById('s_siret').value = state.settings.siret||'';
  document.getElementById('settingsOverlay').style.display='flex';
}
async function saveSettings(){
  state.settings = {
    nom: document.getElementById('s_nom').value.trim(),
    adresse: document.getElementById('s_adresse').value.trim(),
    tel: document.getElementById('s_tel').value.trim(),
    siret: document.getElementById('s_siret').value.trim(),
  };
  await saveState();
  document.getElementById('settingsOverlay').style.display='none';
  render();
}

/* ---- Wiring ---- */
document.getElementById('btnNew').addEventListener('click', openNewForm);
document.getElementById('btnExport').addEventListener('click', exportBackup);
document.getElementById('importInput').addEventListener('change', (e)=>{
  if(e.target.files[0]) importBackup(e.target.files[0]);
  e.target.value = '';
});
document.getElementById('btnSaveTicket').addEventListener('click', saveTicketFromForm);
document.getElementById('btnSaveSettings').addEventListener('click', saveSettings);
document.getElementById('search').addEventListener('input', renderList);
document.getElementById('filterStatus').addEventListener('change', renderList);
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', e=>e.target.closest('.overlay').style.display='none'));
document.querySelectorAll('.overlay').forEach(ov=>ov.addEventListener('click', e=>{ if(e.target===ov) ov.style.display='none'; }));

loadState();
</script>
